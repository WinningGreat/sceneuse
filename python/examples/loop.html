<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>sceneuse loop fixture</title>
<style>
  body { font: 18px/1.4 system-ui, sans-serif; margin: 48px; max-width: 28rem; }
  label { display: block; margin-bottom: 12px; }
  input { font: inherit; padding: 6px 8px; width: 100%; }
  button { font: inherit; padding: 8px 16px; }
  #out { margin-top: 24px; min-height: 1.4em; }
</style>
<h1>sceneuse loop fixture</h1>
<label>
  Name
  <input id="name" name="name" aria-label="Name" placeholder="Name" autocomplete="off">
</label>
<button type="button" id="go">Greet</button>
<p id="out" role="status" aria-live="polite">waiting</p>
<script>
  document.getElementById("go").addEventListener("click", () => {
    const n = document.getElementById("name").value.trim();
    document.getElementById("out").textContent = n ? "hello " + n : "empty";
  });
</script>
</html>
